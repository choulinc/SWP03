<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eff3f8" />
    <meta name="description" content="辦點事，一個簡單好用的待辦清單。把想做的，變成做到了。資料保存在你的瀏覽器中。" />
    <title>辦點事 · 把想做的，變成做到了</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="辦點事首頁">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>辦點事<span class="brand-dot">.</span></span>
        </a>
        <span class="topbar-note">把想做的，變成做到了</span>
      </header>

      <main class="workspace">
        <aside class="intro-panel" aria-label="今日概覽">
          <div class="intro-content">
            <div class="date-line"><span class="date-indicator" aria-hidden="true"></span><span id="today-date"></span></div>
            <h1>把想做的事，<br /><span>一件件完成。</span></h1>
            <p class="intro-description">寫下待辦，專注眼前。每完成一件，就離理想中的今天更近一點。</p>
          </div>
          <div class="progress-block">
            <div class="progress-heading"><span>今日進度</span><strong id="progress-percent">0%</strong></div>
            <div class="progress-track" role="progressbar" aria-label="待辦完成進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar"><span id="progress-fill"></span></div>
            <p id="progress-caption">新增第一件待辦，開始今天的安排。</p>
          </div>
          <div class="panel-ornament" aria-hidden="true"><span></span><span></span><span></span></div>
        </aside>

        <section class="list-panel" aria-labelledby="list-title">
          <div class="list-heading">
            <div>
              <p class="section-label">你的清單</p>
              <h2 id="list-title">待辦事項<span class="task-count" id="task-count">0</span></h2>
            </div>
            <span class="storage-note"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 4 6.5v5c0 5 3.4 8.2 8 9.5 4.6-1.3 8-4.5 8-9.5v-5L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>自動儲存在此瀏覽器</span>
          </div>

          <form id="add-form" class="add-form" autocomplete="off">
            <label class="sr-only" for="new-task">新增待辦事項</label>
            <span class="add-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
            <input id="new-task" name="task" type="text" maxlength="200" placeholder="新增一件想完成的事..." required />
            <button type="submit">新增<span class="button-arrow" aria-hidden="true">↗</span></button>
          </form>
          <p class="form-error" id="form-error" role="alert" hidden></p>

          <div class="list-toolbar">
            <div class="filters" role="group" aria-label="篩選待辦事項">
              <button type="button" class="filter is-active" data-filter="all" aria-pressed="true">全部</button>
              <button type="button" class="filter" data-filter="active" aria-pressed="false">待完成</button>
              <button type="button" class="filter" data-filter="completed" aria-pressed="false">已完成</button>
            </div>
            <span id="remaining-count" class="remaining-count">0 件待完成</span>
          </div>

          <ul id="task-list" class="task-list" aria-label="待辦事項清單"></ul>
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-art" aria-hidden="true"><span class="empty-paper"><span></span><span></span><span></span></span><span class="empty-check">✓</span></div>
            <h3 id="empty-title">從一件小事開始</h3>
            <p id="empty-description">在上方輸入待辦事項，讓今天有個好開始。</p>
          </div>

          <div class="list-footer"><span>一步一步，就很了不起。</span><button id="clear-completed" type="button" hidden>清除已完成</button></div>
          <p id="status-message" class="sr-only" role="status" aria-live="polite"></p>
        </section>
      </main>
      <footer class="site-footer"><span>辦點事</span><span>簡單記錄 · 安心保存</span></footer>
    </div>
  </body>
</html>
